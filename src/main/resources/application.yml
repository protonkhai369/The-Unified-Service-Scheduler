spring:
  application:
    name: service-scheduler
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      schema: ${DB_SCHEMA:scheduler}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:scheduler}
  flyway:
    default-schema: ${DB_SCHEMA:scheduler}
    schemas: ${DB_SCHEMA:scheduler}
    locations: classpath:db/migration,classpath:db/demo
  web:
    locale: en
    locale-resolver: fixed

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

scheduler:
  booking-lock-timeout: 3s
  max-booking-attempts: 5
  slot-step: 30m

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
